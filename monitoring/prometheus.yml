global:
  scrape_interval: 5s

scrape_configs:
  - job_name: hality
    metrics_path: /metrics/
    static_configs:
      - targets: ["localhost:8000"]

  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: gpu
    static_configs:
      - targets: ["localhost:9835"]
